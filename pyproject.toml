[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-material-maker"
version = "0.2.0"
description = "Material Maker adapter for the DCC Model Context Protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["material_maker", "image-editing", "mcp", "dcc", "automation"]
dependencies = ["dcc-mcp-core>=0.19.38,<1.0.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "twine>=6"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-material-maker"
Repository = "https://github.com/dcc-mcp/dcc-mcp-material-maker"
Issues = "https://github.com/dcc-mcp/dcc-mcp-material-maker/issues"

[project.scripts]
dcc-mcp-material-maker = "dcc_mcp_material_maker.server:main"
dcc-mcp-material-maker-install = "dcc_mcp_material_maker.install:main"

[project.entry-points."dcc_mcp.adapters"]
material_maker = "dcc_mcp_material_maker:Material MakerMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_material_maker"]
artifacts = ["src/dcc_mcp_material_maker/skills/**"]

[tool.hatch.build.targets.wheel.force-include]
"bridge/material_maker-plugin/dcc_mcp_material_maker.py" = "dcc_mcp_material_maker/material_maker_plugin/dcc_mcp_material_maker.py"

[tool.hatch.build.targets.sdist]
include = ["src/dcc_mcp_material_maker", "bridge", "tests", "README.md", "LICENSE", "CHANGELOG.md", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
