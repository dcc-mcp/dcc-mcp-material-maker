[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-material-maker"
version = "0.4.1"
description = "Typed Material Maker project inspection and export for DCC-MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["material-maker", "procedural-materials", "ptex", "mcp", "dcc", "automation"]
dependencies = ["dcc-mcp-core>=0.20.14,<1.0.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "jsonschema>=4.17,<5",
    "pytest>=8",
    "pyyaml>=6,<7",
    "ruff>=0.8",
    "tomli>=2,<3; python_version < '3.11'",
    "twine>=7.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-material-maker"
Repository = "https://github.com/dcc-mcp/dcc-mcp-material-maker"
Issues = "https://github.com/dcc-mcp/dcc-mcp-material-maker/issues"

[project.scripts]
dcc-mcp-material-maker = "dcc_mcp_material_maker.server:main"
dcc-mcp-material-maker-doctor = "dcc_mcp_material_maker.install:main"
dcc-mcp-material-maker-install = "dcc_mcp_material_maker.install:main"

[project.entry-points."dcc_mcp.adapters"]
material_maker = "dcc_mcp_material_maker:MaterialMakerMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_material_maker"]
artifacts = ["src/dcc_mcp_material_maker/skills/**"]

[tool.hatch.build.targets.sdist]
include = ["src/dcc_mcp_material_maker", "docs", "tests", "README.md", "install.md", "LICENSE", "CHANGELOG.md", "tools"]
exclude = [
    ".cache/**",
    ".tmp/**",
    ".venv/**",
    "dist/**",
    "docs/**/*.png",
    "docs/**/*.svg",
    "docs/**/*.webp",
    "release/**",
    "work/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
