name: CI
on:
  push:
  pull_request:
env:
  DCC_MCP_CORE_FLOOR: "0.20.14"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install "dcc-mcp-core==${DCC_MCP_CORE_FLOOR}"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python tools/doctor_smoke.py
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python tools/lint_skills.py
      - run: python -m build
      - name: Verify installed wheel uses published Core schema
        if: matrix.python-version == '3.12'
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install "dcc-mcp-core==${DCC_MCP_CORE_FLOOR}" "jsonschema>=4.17,<5" dist/*.whl
          .wheel-smoke/bin/python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from dcc_mcp_core.deployment import install_sop as core_install_sop
          from dcc_mcp_core.deployment import load_install_sop_schema
          from dcc_mcp_material_maker import install
          from jsonschema import Draft202012Validator

          distribution = importlib.metadata.distribution("dcc-mcp-material-maker")
          packaged = {str(item).replace("\\", "/") for item in (distribution.files or ())}
          assert not any(item.endswith("schemas/adapter-install-sop-v1.schema.json") for item in packaged)
          assert not (Path(install.__file__).resolve().parent / "schemas").exists()
          assert install.MIN_CORE_VERSION == "0.20.14"

          schema_path = (
              Path(core_install_sop.__file__).resolve().parent.parent
              / "schemas"
              / "adapter-install-sop-v1.schema.json"
          )
          raw = schema_path.read_bytes()
          assert len(raw) == 4261
          assert hashlib.sha256(raw).hexdigest() == "3ca25788439917b4d4c0617230a762f9797756b5b54f45c8c4149f975b90f904"
          schema = load_install_sop_schema()
          assert schema == json.loads(raw)
          with tempfile.TemporaryDirectory() as directory:
              completed = subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "dcc_mcp_material_maker.install",
                      "doctor",
                      "--json",
                      "--executable",
                      str(Path(directory) / "missing"),
                  ],
                  capture_output=True,
                  check=False,
                  encoding="utf-8",
              )
          assert completed.returncode == 10, completed.stderr
          Draft202012Validator(schema).validate(json.loads(completed.stdout))
          PY
      - if: matrix.python-version == '3.12'
        run: python -m twine check dist/*
