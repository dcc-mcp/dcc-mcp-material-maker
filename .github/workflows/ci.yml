name: CI
on:
  push:
  pull_request:
env:
  DCC_MCP_CORE_FLOOR: "0.20.14"
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install "dcc-mcp-core==${{ env.DCC_MCP_CORE_FLOOR }}"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python tools/doctor_smoke.py
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python tools/lint_skills.py
      - run: python -m build
      - name: Verify installed wheel and standard Install SOP surface
        if: matrix.python-version == '3.12'
        run: python tools/wheel_smoke.py
      - if: matrix.python-version == '3.12'
        run: python -m twine check dist/*
