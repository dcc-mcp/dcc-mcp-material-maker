name: Backfill release

# Replays the release chain for a tag that release-please already created but
# whose publication never finished. Distributions are always built from the tag
# itself, while the release guard comes from a reviewed ref so a guard fix can
# unblock a tag that predates it.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to publish, for example v0.4.1"
        required: true
        type: string
      guard_ref:
        description: "Ref that provides tools/release_guard.py"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  stage-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_id: ${{ steps.stage.outputs.release_id }}
      manifest_sha256: ${{ steps.stage.outputs.manifest_sha256 }}
      snapshot_sha256: ${{ steps.stage.outputs.snapshot_sha256 }}
      artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
      artifact_digest: ${{ steps.upload.outputs['artifact-digest'] }}
      run_id: ${{ github.run_id }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the reviewed release guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.guard_ref }}
          path: .release-guard
          fetch-depth: 1
          persist-credentials: false
      - name: Stage the guard outside the distribution tree
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-guard"
          mv .release-guard/tools/release_guard.py "${RUNNER_TEMP}/release-guard/release_guard.py"
          rm -rf .release-guard
      - id: resolve
        name: Resolve the exact tag commit
        run: |
          set -euo pipefail
          printf 'tag_name=%s\n' "${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install bounded release validators
        run: >-
          python -m pip install --disable-pip-version-check
          "build>=1.2,<2" "twine>=7,<8"
          "dcc-mcp-core==0.20.14" "jsonschema>=4.17,<5"
      - name: Build distributions once
        run: python -m build
      - name: Validate distributions and installed package
        run: python -m twine check dist/* && python tools/wheel_smoke.py
      - id: stage
        name: Create or resume the exact draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python "${RUNNER_TEMP}/release-guard/release_guard.py" stage
          --repository "${{ github.repository }}"
          --tag "${{ inputs.tag_name }}"
          --source-sha "${{ steps.resolve.outputs.source_sha }}"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: |
            dist/
            release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: false

  publish-pypi:
    needs: stage-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-material-maker
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.stage-release.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.guard_ref }}
          path: .release-guard
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recapture exact artifact provenance before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .release-guard/tools/release_guard.py verify-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage-release.outputs.artifact_id }}
          path: .
      - name: Require absent or exact-hash PyPI state
        run: >-
          python .release-guard/tools/release_guard.py pypi-preflight
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --expected-manifest-sha256 "${{ needs.stage-release.outputs.manifest_sha256 }}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true
          print-hash: true
          attestations: true
      - name: Verify exact-hash PyPI completion
        run: >-
          python .release-guard/tools/release_guard.py pypi-verify
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --expected-manifest-sha256 "${{ needs.stage-release.outputs.manifest_sha256 }}"

  publish-github-assets:
    needs: [stage-release, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.stage-release.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.guard_ref }}
          path: .release-guard
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recapture exact artifact provenance before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .release-guard/tools/release_guard.py verify-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage-release.outputs.artifact_id }}
          path: .
      - name: Resume exact owned draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .release-guard/tools/release_guard.py publish-assets
          --repository "${{ github.repository }}"
          --tag "${{ needs.stage-release.outputs.tag_name }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --expected-release-id "${{ needs.stage-release.outputs.release_id }}"
          --expected-manifest-sha256 "${{ needs.stage-release.outputs.manifest_sha256 }}"
          --expected-snapshot-sha256 "${{ needs.stage-release.outputs.snapshot_sha256 }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"

  finalize-release:
    needs: [stage-release, publish-pypi, publish-github-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.stage-release.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.guard_ref }}
          path: .release-guard
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recapture exact artifact provenance before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .release-guard/tools/release_guard.py verify-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage-release.outputs.artifact_id }}
          path: .
      - name: Reverify exact PyPI state and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .release-guard/tools/release_guard.py finalize
          --repository "${{ github.repository }}"
          --tag "${{ needs.stage-release.outputs.tag_name }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --expected-release-id "${{ needs.stage-release.outputs.release_id }}"
          --expected-manifest-sha256 "${{ needs.stage-release.outputs.manifest_sha256 }}"
          --expected-snapshot-sha256 "${{ needs.stage-release.outputs.snapshot_sha256 }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"
