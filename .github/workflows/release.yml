name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.capture.outputs.tag_name }}
      source_sha: ${{ steps.capture.outputs.source_sha }}
      release_id: ${{ steps.capture.outputs.release_id }}
      manifest_sha256: ${{ steps.capture.outputs.manifest_sha256 }}
      snapshot_sha256: ${{ steps.capture.outputs.snapshot_sha256 }}
      artifact_digest: ${{ steps.upload.outputs['artifact-digest'] }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install bounded release validators
        run: >-
          python -m pip install --disable-pip-version-check
          "build>=1.2,<2" "twine>=7,<8"
          "dcc-mcp-core==0.20.14" "jsonschema>=4.17,<5"
      - name: Build distributions once
        run: python -m build
      - name: Validate distributions and installed package
        run: python -m twine check dist/* && python tools/wheel_smoke.py
      - id: capture
        name: Capture exact release identity and SHA-256 manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py capture
          --repository "${{ github.repository }}"
          --tag "${{ needs.release-please.outputs.tag_name }}"
          --source-sha "${{ github.sha }}"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: |
            dist/
            release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-pypi:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-material-maker
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build-release.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recapture release identity before PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py verify
          --repository "${{ github.repository }}"
          --tag "${{ needs.build-release.outputs.tag_name }}"
          --source-sha "${{ needs.build-release.outputs.source_sha }}"
          --expected-release-id "${{ needs.build-release.outputs.release_id }}"
          --expected-manifest-sha256 "${{ needs.build-release.outputs.manifest_sha256 }}"
          --expected-snapshot-sha256 "${{ needs.build-release.outputs.snapshot_sha256 }}"
          --expect-no-assets
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: false
          verbose: true
          print-hash: true
          attestations: true

  publish-github-assets:
    needs: [build-release, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build-release.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recapture release identity before GitHub asset publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py verify
          --repository "${{ github.repository }}"
          --tag "${{ needs.build-release.outputs.tag_name }}"
          --source-sha "${{ needs.build-release.outputs.source_sha }}"
          --expected-release-id "${{ needs.build-release.outputs.release_id }}"
          --expected-manifest-sha256 "${{ needs.build-release.outputs.manifest_sha256 }}"
          --expected-snapshot-sha256 "${{ needs.build-release.outputs.snapshot_sha256 }}"
          --expect-no-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build-release.outputs.tag_name }}
          files: dist/*
          overwrite_files: false
          fail_on_unmatched_files: true
      - name: Verify exact published GitHub asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py verify-assets
          --repository "${{ github.repository }}"
          --tag "${{ needs.build-release.outputs.tag_name }}"
          --source-sha "${{ needs.build-release.outputs.source_sha }}"
          --expected-release-id "${{ needs.build-release.outputs.release_id }}"
          --expected-manifest-sha256 "${{ needs.build-release.outputs.manifest_sha256 }}"
          --expected-snapshot-sha256 "${{ needs.build-release.outputs.snapshot_sha256 }}"
