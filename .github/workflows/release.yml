name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  stage-release:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.detect.outputs.release_needed }}
      tag_name: ${{ steps.stage.outputs.tag_name }}
      source_sha: ${{ steps.stage.outputs.source_sha }}
      release_id: ${{ steps.stage.outputs.release_id }}
      manifest_sha256: ${{ steps.stage.outputs.manifest_sha256 }}
      snapshot_sha256: ${{ steps.stage.outputs.snapshot_sha256 }}
      artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
      artifact_digest: ${{ steps.upload.outputs['artifact-digest'] }}
      run_id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: detect
        name: Detect an exact version transition
        run: python tools/release_guard.py detect-release --source-sha "${{ github.sha }}"
      - name: Install bounded release validators
        if: steps.detect.outputs.release_needed == 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          "build>=1.2,<2" "twine>=7,<8"
          "dcc-mcp-core==0.20.14" "jsonschema>=4.17,<5"
      - name: Build distributions once
        if: steps.detect.outputs.release_needed == 'true'
        run: python -m build
      - name: Validate distributions and installed package
        if: steps.detect.outputs.release_needed == 'true'
        run: python -m twine check dist/* && python tools/wheel_smoke.py
      - id: stage
        name: Create or resume the exact draft release
        if: steps.detect.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py stage
          --repository "${{ github.repository }}"
          --tag "${{ steps.detect.outputs.tag_name }}"
          --source-sha "${{ github.sha }}"
      - id: upload
        if: steps.detect.outputs.release_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: |
            dist/
            release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: false

  publish-pypi:
    needs: stage-release
    if: needs.stage-release.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-material-maker
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.stage-release.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recapture exact artifact provenance before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py verify-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage-release.outputs.artifact_id }}
          path: .
      - name: Require absent or exact-hash PyPI state
        run: >-
          python tools/release_guard.py pypi-preflight
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --expected-manifest-sha256 "${{ needs.stage-release.outputs.manifest_sha256 }}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true
          print-hash: true
          attestations: true
      - name: Verify exact-hash PyPI completion
        run: >-
          python tools/release_guard.py pypi-verify
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --expected-manifest-sha256 "${{ needs.stage-release.outputs.manifest_sha256 }}"

  publish-github-assets:
    needs: [stage-release, publish-pypi]
    if: needs.stage-release.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.stage-release.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recapture exact artifact provenance before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py verify-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage-release.outputs.artifact_id }}
          path: .
      - name: Resume exact owned draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py publish-assets
          --repository "${{ github.repository }}"
          --tag "${{ needs.stage-release.outputs.tag_name }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --expected-release-id "${{ needs.stage-release.outputs.release_id }}"
          --expected-manifest-sha256 "${{ needs.stage-release.outputs.manifest_sha256 }}"
          --expected-snapshot-sha256 "${{ needs.stage-release.outputs.snapshot_sha256 }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"

  finalize-release:
    needs: [stage-release, publish-pypi, publish-github-assets]
    if: needs.stage-release.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.stage-release.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recapture exact artifact provenance before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py verify-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage-release.outputs.artifact_id }}
          path: .
      - name: Reverify exact PyPI state and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release_guard.py finalize
          --repository "${{ github.repository }}"
          --tag "${{ needs.stage-release.outputs.tag_name }}"
          --source-sha "${{ needs.stage-release.outputs.source_sha }}"
          --expected-release-id "${{ needs.stage-release.outputs.release_id }}"
          --expected-manifest-sha256 "${{ needs.stage-release.outputs.manifest_sha256 }}"
          --expected-snapshot-sha256 "${{ needs.stage-release.outputs.snapshot_sha256 }}"
          --artifact-id "${{ needs.stage-release.outputs.artifact_id }}"
          --artifact-digest "${{ needs.stage-release.outputs.artifact_digest }}"
          --run-id "${{ needs.stage-release.outputs.run_id }}"
